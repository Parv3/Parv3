<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Reference pipeline from camera streams to dashboard" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#23262e"/>
    </pattern>
    <filter id="bloom" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="250" fill="#0a0b0e"/>
  <rect width="1200" height="250" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="249" fill="none" stroke="#23262e"/>

  <text x="24" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#ff6a2b">REFERENCE PIPELINE</text>
  <text x="24" y="58" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8a8f9c">streams in, decisions out</text>

  <!-- links -->
  <g fill="none" stroke="#4a4f5c" stroke-width="1.2" stroke-dasharray="5 5">
    <path d="M165 135 H219"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M369 135 H423"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M573 135 H627"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M777 135 H831"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M981 135 H1035"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- packets -->
  <g fill="#ffa36b" filter="url(#bloom)">
    <circle r="3"><animateMotion path="M165 135 H219" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M369 135 H423" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M573 135 H627" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M777 135 H831" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M981 135 H1035" dur="1.6s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- nodes -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <g>
      <rect x="15" y="95" width="150" height="80" rx="3" fill="#0f1116" stroke="#ff6a2b" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;1;0.4;0.4" keyTimes="0;0.06;0.2;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="90" y="131" font-size="13" fill="#efe8dc">Video streams</text>
      <text x="90" y="152" font-size="10.5" fill="#8a8f9c">multiple inputs</text>
    </g>
    <g>
      <rect x="219" y="95" width="150" height="80" rx="3" fill="#0f1116" stroke="#ff6a2b" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;0.4;1;0.4;0.4" keyTimes="0;0.16;0.22;0.36;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="294" y="131" font-size="13" fill="#efe8dc">Decode / batch</text>
      <text x="294" y="152" font-size="10.5" fill="#8a8f9c">frames to tensors</text>
    </g>
    <g>
      <rect x="423" y="95" width="150" height="80" rx="3" fill="#0f1116" stroke="#ff6a2b" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;0.4;1;0.4;0.4" keyTimes="0;0.32;0.38;0.52;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="498" y="131" font-size="13" fill="#efe8dc">Detection</text>
      <text x="498" y="152" font-size="10.5" fill="#8a8f9c">OpenCV / PyTorch</text>
    </g>
    <g>
      <rect x="627" y="95" width="150" height="80" rx="3" fill="#0f1116" stroke="#ff6a2b" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;0.4;1;0.4;0.4" keyTimes="0;0.48;0.54;0.68;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="702" y="131" font-size="13" fill="#efe8dc">Tracking</text>
      <text x="702" y="152" font-size="10.5" fill="#8a8f9c">IDs and trajectories</text>
    </g>
    <g>
      <rect x="831" y="95" width="150" height="80" rx="3" fill="#0f1116" stroke="#ff6a2b" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;0.4;1;0.4;0.4" keyTimes="0;0.64;0.7;0.84;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="906" y="131" font-size="13" fill="#efe8dc">Async gateway</text>
      <text x="906" y="152" font-size="10.5" fill="#8a8f9c">AsyncIO routing</text>
    </g>
    <g>
      <rect x="1035" y="95" width="150" height="80" rx="3" fill="#0f1116" stroke="#ff6a2b" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;0.4;1;0.4;0.4" keyTimes="0;0.8;0.86;0.98;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="1110" y="131" font-size="13" fill="#efe8dc">Dashboard</text>
      <text x="1110" y="152" font-size="10.5" fill="#8a8f9c">React / TypeScript</text>
    </g>
  </g>

  <!-- latency bar -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8f9c">
    <text x="15" y="222">throughput</text>
    <rect x="90" y="214" width="1095" height="4" fill="#161920"/>
    <rect x="90" y="214" width="260" height="4" fill="#ff6a2b">
      <animate attributeName="x" values="90;925;90" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
