<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Parv - AI and ML" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#1c0505"/>
      <stop offset="1" stop-color="#6e0f0f"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b01a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b01a1a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b01a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b4b4" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#c22a2a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c22a2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>
  <circle cx="800" cy="205" r="150" fill="url(#sun)"/>

  <!-- far wall -->
  <path d="M0 232 L0 214 L34 214 L34 206 L52 206 L52 214 L120 214 L120 206 L138 206 L138 214 L250 214 L250 200 L290 200 L290 214 L420 214 L420 206 L438 206 L438 214 L560 214 L560 206 L578 206 L578 214 L700 214 L700 200 L740 200 L740 214 L860 214 L860 206 L878 206 L878 214 L1000 214 L1000 232 Z" fill="#0d0303" opacity="0.85"/>

  <!-- drifting fog -->
  <g filter="url(#soft)">
    <rect x="-400" y="218" width="400" height="26" fill="url(#fog)">
      <animate attributeName="x" values="-400;1000" dur="34s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="238" width="500" height="22" fill="url(#fog)">
      <animate attributeName="x" values="-500;1000" dur="48s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- walking giant -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-140 0; 1140 0" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(0 196) scale(0.82)">
      <g fill="#070202" stroke="#a31f1f" stroke-width="1.4" stroke-linejoin="round">
        <!-- far leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="22 0 0;-22 0 0;22 0 0" dur="2.6s" repeatCount="indefinite"/>
          <path d="M-12 0 L-14 62 L-10 100 L-22 104 L-22 112 L16 112 L14 100 L16 62 L14 0 Z"/>
        </g>
        <!-- far arm -->
        <g transform="translate(0 -86)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-24 0 0;24 0 0;-24 0 0" dur="2.6s" repeatCount="indefinite"/>
            <path d="M-8 0 L-10 56 L-12 84 L-5 90 L8 88 L9 56 L8 0 Z"/>
          </g>
        </g>
        <!-- torso and head, slight vertical bob -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.3s" repeatCount="indefinite"/>
          <path d="M-30 0 L-40 -78 Q-36 -98 -10 -100 L16 -100 Q40 -96 42 -78 L34 0 Z"/>
          <path d="M-6 -100 L-4 -112 L10 -112 L12 -100 Z"/>
          <path d="M-14 -116 Q-18 -146 6 -150 Q30 -150 30 -124 Q30 -108 14 -106 Q-6 -104 -14 -116 Z"/>
          <path d="M6 -129 L22 -127" stroke="#d62a2a" stroke-width="2.4" fill="none">
            <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- near leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-22 0 0;22 0 0;-22 0 0" dur="2.6s" repeatCount="indefinite"/>
          <path d="M-12 0 L-14 62 L-10 100 L-22 104 L-22 112 L16 112 L14 100 L16 62 L14 0 Z"/>
        </g>
        <!-- near arm -->
        <g transform="translate(0 -86)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="24 0 0;-24 0 0;24 0 0" dur="2.6s" repeatCount="indefinite"/>
            <path d="M-8 0 L-10 56 L-12 84 L-5 90 L8 88 L9 56 L8 0 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="282" width="1000" height="38" fill="#030202"/>
  <line x1="0" y1="282.5" x2="1000" y2="282.5" stroke="#a31f1f" stroke-opacity="0.55"/>

  <!-- title -->
  <text x="56" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="16" fill="#f2ecec">PARV</text>
  <rect x="58" y="128" width="64" height="3" fill="#c22a2a"/>
  <text x="58" y="160" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2" fill="#c9b8b8">AI / ML  /  COMPUTER VISION  /  INFERENCE SYSTEMS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
